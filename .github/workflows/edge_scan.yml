name: Edge Scan
on:
  schedule:
    - cron: '0 10 * * *'   # 11:00 Madrid
    - cron: '0 18 * * *'   # 19:00 Madrid
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run edge scan
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}
          THE_ODDS_API_KEY_3: ${{ secrets.THE_ODDS_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL_FB: ${{ secrets.SUPABASE_URL_FB }}
          SUPABASE_KEY_FB: ${{ secrets.SUPABASE_KEY_FB }}
        run: python edge_scan.py
