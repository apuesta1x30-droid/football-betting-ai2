name: Edge Scan

on:
  # Pausado desde 14/11 (CLV -1.64% / yield -0.233).
  # Reactivación prevista 1/12 en modo solo-fusión:
  # descomentar 'schedule:' y los dos cron.
  # schedule:
  #   - cron: '0 10 * * *'
  #   - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run edge scan
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}
          THE_ODDS_API_KEY_3: ${{ secrets.THE_ODDS_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL_FB: ${{ secrets.SUPABASE_URL_FB }}
          SUPABASE_KEY_FB: ${{ secrets.SUPABASE_KEY_FB }}
        run: python edge_scan.py
