name: Closing Odds (CLV)

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Modo prueba: calcula CLV sin guardar'
        type: boolean
        default: false

jobs:
  closing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Capture closing odds
      env:
        THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        SUPABASE_URL_FB: ${{ secrets.SUPABASE_URL_FB }}
        SUPABASE_KEY_FB: ${{ secrets.SUPABASE_KEY_FB }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python closing_odds.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}
