name: Build Team Stats DB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1,15 * *'   # Días 1 y 15 de cada mes a las 03:00 UTC

permissions:
  contents: write

jobs:
  build-team-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Build team_stats_db.csv
        run: python build_team_db.py

      - name: Commit and push updated team_stats_db.csv
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add team_stats_db.csv
          git diff --cached --quiet || git commit -m "Update team_stats_db from football-data"
          git pull --rebase origin main || git pull --no-rebase origin main
          git push
