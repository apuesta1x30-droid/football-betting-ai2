name: Auto Settle Picks

on:
  schedule:
    # 07:15 UTC → liquida la jornada europea anterior
    - cron: '15 7 * * *'
    # 13:15 UTC → liquida la jornada americana
    - cron: '15 13 * * *'
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run settlement
      env:
        API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SUPABASE_URL_FB: ${{ secrets.SUPABASE_URL_FB }}
        SUPABASE_KEY_FB: ${{ secrets.SUPABASE_KEY_FB }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python settle_picks.py
