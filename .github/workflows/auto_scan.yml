name: Auto Scan Value Bets

on:
  schedule:
    - cron: '15 4 * * *'
    - cron: '15 14 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run auto scan
      env:
        THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}
        THE_ODDS_API_KEY_3: ${{ secrets.THE_ODDS_API_KEY_3 }}
        API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SUPABASE_URL_FB: ${{ secrets.SUPABASE_URL_FB }}
        SUPABASE_KEY_FB: ${{ secrets.SUPABASE_KEY_FB }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python auto_scan.py
