name: Auto Scan Value Bets

# ============================================
# CUÁNDO SE EJECUTA
# ============================================
on:
  schedule:
    # Ejecutar a las 04:00 UTC (06:00 hora España en verano)
    # Ejecutar a las 15:00 UTC (17:00 hora España en verano)
    # Nota: En invierno (desde finales de octubre), España pasa a UTC+1
    # Entonces 04:00 UTC = 05:00 España. Si quieres mantener las 06:00,
    # cambia '0 4' por '0 5' en esas fechas.
    - cron: '15 4 * * *'
    - cron: '30 14 * * *'
  
  # Permitir ejecución manual desde la pestaña Actions de GitHub
  workflow_dispatch:

# ============================================
# TRABAJO PRINCIPAL
# ============================================
jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    # Paso 1: Descargar el repositorio
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # Paso 2: Instalar Python 3.11
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # Paso 3: Instalar las librerías necesarias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Paso 4: Ver qué archivos hay (útil para debug)
    - name: List files (debug)
      run: |
        echo "=== Archivos en el repositorio ==="
        ls -la
        echo ""
        echo "=== Contenido de .github/workflows ==="
        ls -la .github/workflows/
    
    # Paso 5: Ejecutar el script principal
    - name: Run auto scan
      env:
        THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python auto_scan.py
